[package]
name = "cli-ner"
version = "0.1.1"
edition = "2021"
description = "Advanced, safe, and documented CLI for macOS disk space management and cleanup."
authors = ["Fabrizio Riccardo <[djfabrix@gmail.com]>"]
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
trash = "5.2"
colored = "2.1"
indicatif = "0.17"
comfy-table = "7.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dialoguer = "0.11"
humansize = "2.1"
walkdir = "2.5"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
sysinfo = "0.31"
uuid = { version = "1.10", features = ["v4", "serde"] }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
