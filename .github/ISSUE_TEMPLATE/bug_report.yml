name: 🐛 Bug Report
description: Report a defect, unexpected error, or safety violation in cli-ner
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue and keep `cli-ner` safe and reliable!
  - type: input
    id: version
    attributes:
      label: cli-ner Version
      description: What version of cli-ner are you running? (Run `cli-ner --version`)
      placeholder: e.g. 0.1.1
    validations:
      required: true
  - type: dropdown
    id: macos_arch
    attributes:
      label: macOS Architecture & Hardware
      description: What Mac hardware are you using?
      options:
        - "Apple Silicon (M1 / M2 / M3 / M4)"
        - "Intel Mac (x86_64)"
    validations:
      required: true
  - type: input
    id: macos_version
    attributes:
      label: macOS Version
      description: Which version of macOS are you running? (e.g., macOS 15 Sequoia, macOS 14 Sonoma)
      placeholder: e.g. macOS 14.5 (Sonoma)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Run 'cli-ner clean'
        2. Inspect output
        3. ...
    validations:
      required: true
  - type: textarea
    id: doctor_output
    attributes:
      label: Output of `cli-ner doctor`
      description: Please paste the output of `cli-ner doctor` to help diagnose your system environment.
      render: shell
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Snippet
      description: Check `~/.cli-ner/logs/` for the latest operation log if applicable.
      render: json
  - type: checkboxes
    id: safety_check
    attributes:
      label: Safety & Dry-Run Confirmation
      options:
        - label: Did this occur during a dry-run (default `cli-ner clean`) or an executed clean (`cli-ner clean --execute`)?
          required: false
