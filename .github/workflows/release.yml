name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            arch_name: apple-silicon
          - os: macos-13
            target: x86_64-apple-darwin
            arch_name: intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Extract Tag or Version
        id: vars
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" == refs/* || -z "$TAG" ]]; then
            TAG="v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package artifacts
        run: |
          VERSION="${{ steps.vars.outputs.tag }}"
          TARGET="${{ matrix.target }}"
          ARCHIVE_NAME="cli-ner-${VERSION}-${TARGET}"
          mkdir -p "dist/${ARCHIVE_NAME}"

          cp "target/${TARGET}/release/cli-ner" "dist/${ARCHIVE_NAME}/"
          cp README.md "dist/${ARCHIVE_NAME}/"
          if [ -f LICENSE ]; then cp LICENSE "dist/${ARCHIVE_NAME}/"; fi

          cd dist
          tar -czf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"
          shasum -a 256 "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"
          cd ..

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-all
          merge-multiple: true

      - name: Generate Checksums List
        run: |
          cd dist-all
          cat *.sha256 > checksums.txt
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            dist-all/*.tar.gz
            dist-all/*.sha256
            dist-all/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
